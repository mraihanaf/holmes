[project]
name = "holmes-stats-engine"
version = "1.0.0"
description = "Stateless trend statistics service for Holmes"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "numpy>=2.1.0",
  "scipy>=1.14.0",
  "pymannkendall>=1.4.3",
  "statsmodels>=0.14.4",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "httpx>=0.27.0", "pyshp>=2.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
